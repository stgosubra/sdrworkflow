<html lang="en">
<head>

<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel2:#f1f3f7; --line:#e6e9ef;
    --txt:#141a24; --muted:#5b6675; --dim:#8b94a3;
    --accent:#2f6bff; --accent-weak:#eaf0ff;
    --hot:#e5484d; --warm:#d9730d; --cool:#2f6bff; --cold:#8b94a3;
    --fresh:#0f9d58; --cooling:#c98a00; --stale:#d9730d; --urgent:#e5484d; --critical:#c0353a; --gone:#9aa3b2;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
    --shadow-md:0 4px 14px rgba(16,24,40,.08);
    --shadow-lg:0 12px 32px rgba(16,24,40,.16);
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .mono,.num{font-variant-numeric:tabular-nums}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1440px;margin:0 auto;padding:20px}
  /* L2 layout */
  .layout{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}
  .sidebar{position:sticky;top:20px;display:flex;flex-direction:column;gap:16px;animation:rise .4s ease both}
  .content{min-width:0;animation:rise .4s .06s ease both}
  .brand h1{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
  .brand .sub{color:var(--muted);font-size:12px;line-height:1.5}
  .brand .sub b{color:var(--txt);font-weight:600}
  .side-filters{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-sm);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px}
  .toolbar{position:sticky;top:20px;z-index:5;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;background:var(--bg);padding:2px 0}
  .table-card{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-sm);border-radius:var(--radius);overflow:hidden}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media(max-width:900px){
    .layout{grid-template-columns:1fr}
    .sidebar{position:static}
    .kpis{flex-direction:row!important;flex-wrap:wrap}
    .kpi{flex:1 1 150px}
    .toolbar{position:static}
  }
  /* KPI stack */
  .kpis{display:flex;flex-direction:column;gap:10px}
  .kpi{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-sm);border-radius:var(--radius);padding:13px 15px;cursor:pointer;transition:box-shadow .12s,border-color .12s,background .12s;text-align:left;width:100%}
  .kpi:hover{box-shadow:var(--shadow-md);border-color:#d5dae4}
  .kpi.active{border-color:var(--accent);background:var(--accent-weak);box-shadow:0 0 0 3px var(--accent-weak)}
  .kpi .n{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:2px;font-weight:600}
  .kpi .d{color:var(--dim);font-size:11px;margin-top:2px}
  .kpi[data-kpi="qual"]{border-left:3px solid var(--hot)}
  /* trend */
  .trend{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-sm);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .trend .lab{color:var(--muted);font-size:12px}
  .trend svg{display:block}
  .trend .delta{font-weight:700;font-size:13px}
  .up{color:var(--hot)} .down{color:var(--fresh)} .flat{color:var(--muted)}
  /* controls */
  .side-filters .fl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  input,select{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 10px;font-size:13px;outline:none;font-family:inherit;transition:border-color .12s,box-shadow .12s}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  .tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
  .tabs button{background:transparent;color:var(--muted);border:0;padding:6px 13px;cursor:pointer;font-size:13px;font-weight:600;border-radius:7px;font-family:inherit;transition:.12s}
  .tabs button:hover{color:var(--txt)}
  .tabs button.on{background:var(--panel);color:var(--txt);box-shadow:var(--shadow-sm)}
  .toggle{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent)}
  .spacer{flex:1}
  /* table */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:11px 12px;background:var(--panel2);border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
  th:hover{color:var(--txt)}
  td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:last-child td{border-bottom:0}
  tr.row:hover{background:var(--bg)}
  tr.snoozed{opacity:.5}
  .lead-name{font-weight:700}
  .country-cell{font-variant-numeric:tabular-nums;white-space:nowrap}
  .hotflag{display:inline-block;margin-left:6px;background:#fdecec;color:#c0353a;border:1px solid #f4c9c9;border-radius:999px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:.03em;vertical-align:middle}
  .dealflag{display:inline-block;margin-left:6px;background:#3a0d0f;color:#fff;border:1px solid #c0353a;border-radius:999px;padding:1px 7px;font-size:10px;font-weight:800;letter-spacing:.03em;vertical-align:middle}
  .kpi[data-kpi="dealflag"]{border-left:3px solid #c0353a}
  .kpi[data-kpi="dealflag"] .n{color:#c0353a}
  /* engagement-tier cards mirror the section-header colours in the table below */
  .kpi[data-kpi="tier:Working"]{border-left:3px solid var(--fresh)}
  .kpi[data-kpi="tier:Lukewarm"]{border-left:3px solid var(--warm)}
  .kpi[data-kpi="tier:Approached"]{border-left:3px solid var(--stale)}
  tr.contacted{opacity:.45}
  .selcol{width:28px;text-align:center}
  .selcol input{accent-color:var(--accent);cursor:pointer}
  .bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-weak);border:1px solid #cfe0ff;border-radius:10px;padding:8px 12px;margin-bottom:10px}
  .bulkbar .cnt{font-weight:700;color:#1d4ed8}
  .bulk-list{display:flex;flex-direction:column;gap:8px;margin:12px 0;max-height:52vh;overflow:auto}
  .bulk-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px}
  .bulk-item.done{opacity:.5}
  .bulk-item .who{flex:1;min-width:0}
  .bulk-item .who .nm{font-weight:700}
  .bulk-item .who .em{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .langtag{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
  .lead-co{color:var(--muted);font-size:12px}
  .lead-meta{color:var(--dim);font-size:11px;margin-top:2px}
  .pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
  .status-NEW{background:var(--accent-weak);color:#1d4ed8}
  .status-OPEN{background:#e5f5ea;color:#0f7a43}
  .status-IN_PROGRESS{background:#fbf1d9;color:#9a6b00}
  .status-Demo\ no\ show{background:#fdecec;color:#c0353a}
  .status-Unable\ to\ Contact{background:#eef0f3;color:#5b6675}
  .stale-fresh{color:var(--fresh)} .stale-cooling{color:var(--cooling)} .stale-stale{color:var(--stale)}
  .stale-urgent{color:var(--urgent)} .stale-critical{color:var(--critical);font-weight:700} .stale-gone{color:var(--gone)}
  .score{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
  .score-hot{color:var(--hot)} .score-warm{color:var(--warm)} .score-cool{color:var(--cool)} .score-cold{color:var(--cold)}
  .bd{font-size:11px;color:var(--muted);margin-top:3px;max-width:260px;display:flex;flex-wrap:wrap;gap:1px 8px}
  .bd span{white-space:nowrap;margin-right:8px}
  .bd .pos{color:var(--fresh)} .bd .neg{color:var(--hot)}
  .btn{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-sm);color:var(--txt);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.12s}
  .btn:hover{border-color:#d5dae4;box-shadow:var(--shadow-md)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#255ae0;border-color:#255ae0}
  .btn.mini{padding:3px 8px;font-size:11px}
  .actions{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
  .row-actions{display:flex;gap:5px;flex-wrap:wrap}
  .sig{font-size:11px;color:var(--dim)}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.35);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-lg);border-radius:14px;padding:20px;width:min(620px,92vw);max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 10px;font-weight:700}
  .modal textarea{width:100%;min-height:200px;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px;font:13px/1.5 ui-monospace,monospace;resize:vertical}
  .modal input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 10px;font-size:13px}
  .modal .foot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .close{float:right;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
  .reasons{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .reasons button{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-sm);color:var(--txt);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  .reasons button:hover{border-color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:50px}
  .footnote{color:var(--dim);font-size:11px;margin-top:16px;line-height:1.6}
  .section-header{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:22px 0 8px;display:flex;align-items:baseline;gap:10px}
  .section-count{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .section-desc{font-size:11px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;font-style:italic}
  .section-working{color:var(--fresh)}
  .section-lukewarm{color:var(--warm)}
  .section-approached{color:var(--stale)}
  .table-card+.section-header{margin-top:10px}
</style>

function buildEmail(c){
  const name = c.firstname || c.name?.split(' ')[0] || 'there';
  if(c.hasQual){
    const t = POST_QUAL[c.outreachLang] || POST_QUAL.en;
    return { subject: t.subject, body: t.body(name) };
  }
  if(c.engagementTier === 'Working'){
    const t = WORKING_FOLLOWUP[c.outreachLang] || WORKING_FOLLOWUP.en;
    return { subject: t.subject, body: t.body(name) };
  }
  if(c.engagementTier === 'Lukewarm'){
    const t = LUKEWARM[c.outreachLang] || LUKEWARM.en;
    return { subject: t.subject, body: t.body(name) };
  }
  const r = REACTIVATION[c.outreachLang] || REACTIVATION.en;
  return { subject: r.subject, body: r.body(name) };
}

// Contacted = leads you've emailed from here. Browser-only bridge: Gmail sends don't cross a lead
// off until the next HubSpot pull moves notes_last_updated, so this fills the same-day gap.
const loadContacted=()=>{try{return JSON.parse(localStorage.getItem(CONTACTED_KEY)||'{}')}catch{return{}}};

const state={ tab:'7d', kpi:'all', q:'', status:'ALL', seat:'ALL', sortKey:'score', sortDir:'desc', showSnoozed:false, showContacted:false, selected:new Set() };

// pass-through: scores precomputed by refresh.mjs
const ALL = SNAPSHOT.contacts.map(c => ({
  ...c,
  // score, breakdown, segment, hasQual, seatBand, seatRank come precomputed from refresh.mjs
  scoreClass: 'score-' + c.segment
}));

// ---- trend (day-over-day, accumulates in localStorage) ----
function recordTrend(count){
  let t; try{t=JSON.parse(localStorage.getItem(TREND_KEY)||'[]')}catch{t=[]}
  const today=new Date(NOW).toISOString().slice(0,10);
  if(!t.length || t[t.length-1].d!==today) t.push({d:today,n:count});
  else t[t.length-1].n=count;
  t=t.slice(-30); localStorage.setItem(TREND_KEY,JSON.stringify(t)); return t;
}

// ---- filtering ----
// staleDays>=th, matching the pull floor (notes_last_updated < today-7d => staleDays>=7). Using > silently hid the =7 cohort.
function baseFor(tab){ const th=tab==='14d'?14:7; return ALL.filter(c=>c.staleDays===null||c.staleDays>=th); }
function filtered(){
  // Deal-without-qual is a data-integrity alert, not a staleness bucket - surface across ALL leads.
  let arr = state.kpi==='dealflag' ? ALL.filter(c=>c.dealButNotQualified) : baseFor(state.tab);
  if(state.status!=='ALL') arr=arr.filter(c=>c.status===state.status);
  if(state.seat!=='ALL') arr=arr.filter(c=>c.seatBand===state.seat);
  if(state.kpi==='qual') arr=arr.filter(c=>c.hasQual);
  if(state.kpi.startsWith('tier:')) arr=arr.filter(c=>c.engagementTier===state.kpi.slice(5));
  if(!state.showSnoozed) arr=arr.filter(c=>!snoozed[c.id]);
  if(!state.showContacted) arr=arr.filter(c=>!contacted[c.id]);
  const q=state.q.trim().toLowerCase();
  if(q) arr=arr.filter(c=>[c.name,c.email,c.country].some(v=>(v||'').toLowerCase().includes(q)));
  const dir=state.sortDir==='asc'?1:-1;
  const key=state.sortKey;
  arr=[...arr].sort((a,b)=>{
    let av,bv;
    if(key==='staleDays'){av=a.staleDays==null?1e9:a.staleDays;bv=b.staleDays==null?1e9:b.staleDays;}
    else if(key==='name'){return dir*(a.name||'').localeCompare(b.name||'');}
    else if(key==='mqlDate'){av=new Date(a.mqlDate||0).getTime();bv=new Date(b.mqlDate||0).getTime();}
    else {av=a[key]||0;bv=b[key]||0;}
    return dir*(av-bv);
  });
  return arr;
}

// ---- render ----
function trendSvg(t){
  if(t.length<2) return '<span class="dim" style="color:var(--dim);font-size:12px">building history - reopen daily to chart it</span>';
  const w=160,h=34,max=Math.max(...t.map(x=>x.n)),min=Math.min(...t.map(x=>x.n)),rng=(max-min)||1;
  const pts=t.map((x,i)=>`${(i/(t.length-1)*w).toFixed(1)},${(h-((x.n-min)/rng)*h).toFixed(1)}`).join(' ');
  const first=t[0].n,last=t[t.length-1].n,delta=last-first;
  const cls=delta>0?'up':delta<0?'down':'flat', arrow=delta>0?'▲':delta<0?'▼':'—';
  return `<svg width="${w}" height="${h}"><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts}"/></svg>
    <span class="delta ${cls}">${arrow} ${delta>0?'+':''}${delta} over ${t.length}d</span>`;
}

  document.getElementById('seat').onchange=e=>{state.seat=e.target.value;render();};
  document.getElementById('snz').onchange=e=>{state.showSnoozed=e.target.checked;render();};

  document.querySelectorAll('[data-uncontacted]').forEach(b=>b.onclick=()=>{delete contacted[b.dataset.uncontacted];saveContacted(contacted);render();});

  document.querySelectorAll('[data-sel]').forEach(cb=>cb.onchange=()=>{const id=cb.dataset.sel;if(cb.checked)state.selected.add(id);else state.selected.delete(id);render();});
  const selAll=document.getElementById('selAll');

  const bc=document.getElementById('bulkClear'); if(bc) bc.onclick=()=>{state.selected.clear();render();};
}

    <textarea id="ebody">${esc(body)}</textarea>
    <div class="foot">
      <button class="btn" id="copy">Copy to clipboard</button>
      <a class="btn primary" id="gcompose" href="${gmail}" target="_blank" rel="noopener">Compose in Gmail</a>
      <a class="btn" href="${mailto}">Mail client</a>
      <a class="btn" href="${hsUrl(c.id)}" target="_blank" rel="noopener">Open in HubSpot</a>
    </div>
  </div>`;
  document.body.appendChild(bg);
  bg.onclick=e=>{if(e.target===bg)bg.remove();};
  bg.querySelector('.close').onclick=()=>bg.remove();
  bg.querySelector('#copy').onclick=()=>{navigator.clipboard.writeText(document.getElementById('ebody').value);bg.querySelector('#copy').textContent='Copied ✓';};
  // Composing in Gmail = contacted. Cross it off locally so you don't double-hit before next pull.
  bg.querySelector('#gcompose').onclick=()=>{markContacted(c.id);setTimeout(()=>{bg.remove();render();},50);};
}

// ---- snooze modal ----
function openSnooze(id){
  const c=ALL.find(x=>x.id===id);
  const REASONS=['Contacted today','Not a fit','Wrong contact','Following up later','Handed to AE','No response - closing'];
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">
    <button class="close">&times;</button>
    <h3>Snooze / dismiss &mdash; ${esc(c.name)}</h3>
    <div style="color:var(--muted);font-size:12px;margin-bottom:8px">Removes this lead from the ACTION NEEDED list (this browser only). Reason is logged locally.</div>
    <div class="reasons">${REASONS.map(r=>`<button data-r="${esc(r)}">${esc(r)}</button>`).join('')}</div>
    <input type="text" id="rcustom" placeholder="or type a custom reason..."/>
    <div class="foot"><button class="btn" id="dosnooze">Snooze with custom reason</button></div>
  </div>`;
  document.body.appendChild(bg);
  bg.onclick=e=>{if(e.target===bg)bg.remove();};
  bg.querySelector('.close').onclick=()=>bg.remove();
  bg.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{snoozed[id]=b.dataset.r;saveSnooze(snoozed);bg.remove();render();});
  bg.querySelector('#dosnooze').onclick=()=>{const v=bg.querySelector('#rcustom').value.trim()||'Snoozed';snoozed[id]=v;saveSnooze(snoozed);bg.remove();render();};
}

// ---- bulk outreach modal ----
// Bodies are personalised per lead (name + language route), so a single Gmail draft can't cover the
// batch. Instead: one personalised Compose link per lead. Clicking it opens Gmail AND marks contacted.
function openBulk(){
  const sel=filtered().filter(c=>state.selected.has(c.id));
  const withEmail=sel.filter(c=>c.email), noEmail=sel.filter(c=>!c.email);
  const bg=document.createElement('div'); bg.className='modal-bg';
  const item=c=>{
    const {subject,body}=buildEmail(c);
    const gmail=`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(c.email)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    return `<div class="bulk-item" data-bid="${c.id}">
      <span class="langtag">${c.outreachLang}</span>
      <div class="who"><div class="nm">${esc(c.name)}${c.hasQual?' <span class="hotflag">HOT</span>':''}</div><div class="em">${esc(c.email)}</div></div>
      <a class="btn primary mini bulk-go" data-gid="${c.id}" href="${gmail}" target="_blank" rel="noopener">Compose</a>
    </div>`;
  };
  bg.innerHTML=`<div class="modal">
    <button class="close">&times;</button>
    <h3>Bulk outreach &mdash; ${withEmail.length} lead${withEmail.length===1?'':'s'}</h3>
    <div style="color:var(--muted);font-size:12px;margin-bottom:6px">Each lead gets a personalised, language-routed draft. Clicking <b>Compose</b> opens Gmail and marks that lead contacted here. ${noEmail.length?`<span style="color:var(--hot)">${noEmail.length} skipped - no email on record.</span>`:''}</div>
    <div class="bulk-list">${withEmail.map(item).join('')}</div>
    <div class="foot">
      <button class="btn" id="markAll">Mark all as contacted</button>
      <button class="btn" id="bulkClose2">Done</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  const close=()=>{bg.remove();state.selected.clear();render();};
  bg.onclick=e=>{if(e.target===bg)close();};
  bg.querySelector('.close').onclick=close;
  bg.querySelector('#bulkClose2').onclick=close;
  bg.querySelector('#markAll').onclick=()=>{withEmail.forEach(c=>markContacted(c.id));close();};
  bg.querySelectorAll('.bulk-go').forEach(a=>a.onclick=()=>{markContacted(a.dataset.gid);a.closest('.bulk-item').classList.add('done');saveContacted(contacted);});
}

render();
</script>
</body>
</html>
